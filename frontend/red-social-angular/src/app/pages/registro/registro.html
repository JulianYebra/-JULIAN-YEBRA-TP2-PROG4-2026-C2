<div class="registro-container">
  <div class="registro-card">

    <h1>Crear cuenta</h1>
    <p>Completá tus datos para unirte a la red social.</p>

    <form (ngSubmit)="mostrarDatos()">

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ingresá tu nombre"
        />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input
          type="text"
          id="apellido"
          name="apellido"
          [(ngModel)]="apellido"
          placeholder="Ingresá tu apellido"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@correo.com"
        />
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Elegí un nombre de usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 8 caracteres"
        />
      </div>

      <div class="form-group">
        <label for="confirmarPassword">Repetir contraseña</label>
        <input
          type="password"
          id="confirmarPassword"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          placeholder="Repetí tu contraseña"
        />
      </div>

      <div class="form-group">
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input
          type="date"
          id="fechaNacimiento"
          name="fechaNacimiento"
          [(ngModel)]="fechaNacimiento"
        />
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción breve</label>
        <textarea
          id="descripcion"
          name="descripcion"
          [(ngModel)]="descripcion"
          placeholder="Contanos algo sobre vos"
          rows="3"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="foto">Foto de perfil</label>
        <input
          type="file"
          id="foto"
          name="foto"
          accept="image/*"
        />
      </div>

      <button type="submit">Registrarme</button>

    </form>

    <p class="login-link">
      ¿Ya tenés una cuenta?
      <a routerLink="/login">Iniciá sesión</a>
    </p>

  </div>
</div>
